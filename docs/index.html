<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Catálogo - Upload Drive</title>

    <!-- ✅ caminho relativo -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <button
          id="loginToggle"
          type="button"
          class="icon-btn"
          aria-label="Login administrativo"
          title="Login administrativo"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Zm3 4a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"
            />
          </svg>
        </button>
      </div>

      <div id="loginPanel" class="login-panel" hidden>
        <form id="loginForm" class="row login-form">
          <label class="field">
            <span>Senha do backend</span>
            <input
              id="password"
              type="password"
              placeholder="Digite a senha"
              autocomplete="current-password"
            />
          </label>
          <button type="submit" class="secondary">Entrar</button>
        </form>
        <p id="loginStatus" class="status login-status" aria-live="polite"></p>
      </div>

      <section class="card admin-only" id="adminCard" hidden>
        <h1>Upload para o Google Drive (pasta do catálogo)</h1>
        <p class="hint">
          Envie uma imagem. Ela será enviada para o Drive e marcada como
          pública.
        </p>

        <form class="row" id="uploadForm" enctype="multipart/form-data">
          <label class="field">
            <span>Nome do Produto</span>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="Nome do Produto"
              required
            />
          </label>
          <label class="field">
            <span>Tipo</span>
            <input id="type" name="type" type="text" placeholder="Tipo" />
          </label>
          <label class="field">
            <span>Material</span>
            <input
              id="material"
              name="material"
              type="text"
              placeholder="Material"
            />
          </label>
          <label class="field">
            <span>Ambientes (separados por vírgula)</span>
            <input
              id="ambientes"
              name="ambientes"
              type="text"
              placeholder="Ambientes (separados por vírgula)"
            />
          </label>
          <input id="file" type="file" name="image" accept="image/*" required />
          <button type="submit">Enviar</button>
        </form>
      </section>

      <section class="card">
        <div class="header-row">
          <h2>Imagens na pasta</h2>
          <button id="refresh" type="button" class="secondary">
            Recarregar
          </button>
        </div>
        <p class="hint" id="count">Carregando...</p>
        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="grid" id="grid"></section>
    </main>

    <div id="imageModal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-label="Visualização da imagem"
      >
        <button
          type="button"
          class="modal-close icon-btn"
          aria-label="Fechar"
          title="Fechar"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6.4 5l12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19l-1.4-1.4L17.6 5l1.4 1.4Z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="modal-nav prev icon-btn"
          aria-label="Imagem anterior"
          title="Imagem anterior"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.4 6.4 9.8 12l5.6 5.6-1.4 1.4L7 12l7-7 1.4 1.4Z" />
          </svg>
        </button>
        <img id="modalImage" alt="" />
        <button
          type="button"
          class="modal-nav next icon-btn"
          aria-label="Próxima imagem"
          title="Próxima imagem"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8.6 6.4 1.4-1.4 7 7-7 7-1.4-1.4 5.6-5.6-5.6-5.6Z" />
          </svg>
        </button>
      </div>
    </div>

    <script>
      // ✅ Troque aqui dependendo do ambiente:
      // Local: "http://localhost:3000"
      // Produção: "https://seu-backend.com"
      const API_BASE =
        location.hostname === "localhost"
          ? "http://localhost:3000"
          : "https://teste-drive-pbow.onrender.com"

      const grid = document.getElementById("grid")
      const count = document.getElementById("count")
      const refreshBtn = document.getElementById("refresh")
      const statusEl = document.getElementById("status")
      const uploadForm = document.getElementById("uploadForm")
      const fileInput = document.getElementById("file")
      const passwordInput = document.getElementById("password")
      const loginToggle = document.getElementById("loginToggle")
      const loginPanel = document.getElementById("loginPanel")
      const loginForm = document.getElementById("loginForm")
      const loginStatus = document.getElementById("loginStatus")
      const adminCard = document.getElementById("adminCard")
      const imageModal = document.getElementById("imageModal")
      const modalImage = document.getElementById("modalImage")
      const modalClose = imageModal.querySelector(".modal-close")
      const modalPrev = imageModal.querySelector(".modal-nav.prev")
      const modalNext = imageModal.querySelector(".modal-nav.next")
      let PASSWORD = ""
      let isAuthenticated = false
      const DEFAULT_DB_URL = new URL("db.json", window.location.href).toString()
      let currentImages = []
      let currentIndex = -1

      function getPassword() {
        return PASSWORD
      }

      function setPassword(value) {
        PASSWORD = value || ""
      }

      passwordInput.addEventListener("input", (event) => {
        setPassword(event.target.value)
        if (loginStatus.textContent) {
          loginStatus.textContent = ""
        }
      })

      function withPasswordHeaders(options = {}) {
        const headers = new Headers(options.headers || {})
        headers.set("x-password", getPassword())
        return { ...options, headers }
      }

      function setAuthenticated(value) {
        isAuthenticated = value
        adminCard.hidden = !value
        loginToggle.classList.toggle("is-auth", value)
      }

      async function validatePassword() {
        if (!getPassword()) {
          loginStatus.textContent = "Digite a senha para entrar."
          return false
        }

        loginStatus.textContent = "Validando..."
        try {
          const res = await fetch(
            `${API_BASE}/api/auth`,
            withPasswordHeaders({ cache: "no-store" }),
          )
          if (!res.ok) throw new Error("Senha inválida")
          loginStatus.textContent = "Login liberado."
          setAuthenticated(true)
          await loadImages()
          return true
        } catch (error) {
          console.error(error)
          loginStatus.textContent = "Senha incorreta."
          setAuthenticated(false)
          return false
        }
      }

      async function loadImages() {
        statusEl.textContent = ""
        grid.innerHTML = ""
        count.textContent = "Carregando..."

        try {
          const data = await fetchCatalog()
          const images = data.images || []
          currentImages = images
          count.textContent = `Mostrando ${images.length} imagem(ns).`

          for (const [index, img] of images.entries()) {
            const card = document.createElement("div")
            card.className = "imgcard"

            const imageEl = document.createElement("img")
            imageEl.src = resolveImageUrl(img)
            imageEl.alt = img.name || img.originalName || "Imagem do catálogo"
            imageEl.addEventListener("click", () => openModal(index))

            const meta = document.createElement("div")
            meta.className = "meta"

            const title = document.createElement("div")
            title.className = "name"
            title.textContent = img.name || img.originalName || "Sem nome"

            const details = document.createElement("div")
            details.className = "details"
            details.innerHTML = `
              ${img.type ? `<div><strong>Tipo:</strong> ${img.type}</div>` : ""}
              ${
                img.material
                  ? `<div><strong>Material:</strong> ${img.material}</div>`
                  : ""
              }
              ${
                img.ambientes && img.ambientes.length
                  ? `<div><strong>Ambientes:</strong> ${img.ambientes.join(", ")}</div>`
                  : ""
              }
            `

            const actions = document.createElement("div")
            actions.className = "actions"

            if (isAuthenticated) {
              const editBtn = document.createElement("button")
              editBtn.type = "button"
              editBtn.className = "secondary small-btn"
              editBtn.textContent = "Editar"
              editBtn.addEventListener("click", async () => {
                const newName = prompt(
                  "Nome do produto:",
                  img.name || img.originalName || "",
                )
                if (!newName || !newName.trim()) return
                const newType = prompt("Tipo:", img.type || "")
                const newMaterial = prompt("Material:", img.material || "")
                const newAmbientes = prompt(
                  "Ambientes (separados por vírgula):",
                  Array.isArray(img.ambientes) ? img.ambientes.join(", ") : "",
                )

                try {
                  const res = await fetch(
                    `${API_BASE}/api/images/${img.id}`,
                    withPasswordHeaders({
                      method: "PUT",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({
                        name: newName.trim(),
                        type: newType || "",
                        material: newMaterial || "",
                        ambientes: newAmbientes || "",
                      }),
                    }),
                  )

                  if (!res.ok) throw new Error("Falha ao atualizar")
                  statusEl.textContent = "Imagem atualizada com sucesso."
                  await loadImages()
                } catch (e) {
                  console.error(e)
                  statusEl.textContent = "Erro ao atualizar imagem."
                }
              })

              const deleteBtn = document.createElement("button")
              deleteBtn.type = "button"
              deleteBtn.className = "danger small-btn"
              deleteBtn.textContent = "Apagar"
              deleteBtn.addEventListener("click", async () => {
                const confirmDelete = confirm(
                  `Tem certeza que deseja apagar "${img.name}"?`,
                )
                if (!confirmDelete) return

                try {
                  const res = await fetch(
                    `${API_BASE}/api/images/${img.id}`,
                    withPasswordHeaders({ method: "DELETE" }),
                  )

                  if (!res.ok) throw new Error("Falha ao apagar")
                  statusEl.textContent = "Imagem apagada."
                  await loadImages()
                } catch (e) {
                  console.error(e)
                  statusEl.textContent = "Erro ao apagar imagem."
                }
              })

              actions.appendChild(editBtn)
              actions.appendChild(deleteBtn)
            }

            meta.appendChild(title)
            meta.appendChild(details)
            if (isAuthenticated) {
              meta.appendChild(actions)
            }
            card.appendChild(imageEl)
            card.appendChild(meta)
            grid.appendChild(card)
          }
        } catch (e) {
          console.error(e)
          count.textContent = "Erro ao carregar imagens."
          statusEl.textContent =
            "Falha ao listar imagens. Verifique a URL do backend."
        }
      }

      uploadForm.addEventListener("submit", async (ev) => {
        ev.preventDefault()
        statusEl.textContent = ""

        const file = fileInput.files?.[0]
        if (!file) return
        const formData = new FormData(uploadForm)

        try {
          const res = await fetch(
            `${API_BASE}/upload`,
            withPasswordHeaders({
              method: "POST",
              body: formData,
            }),
          )

          if (!res.ok) throw new Error("Upload falhou")
          uploadForm.reset()
          statusEl.textContent = "Upload enviado! Recarregando..."
          await loadImages()
        } catch (e) {
          console.error(e)
          statusEl.textContent =
            "Erro no upload. Verifique se o backend está rodando e com CORS liberado."
        }
      })

      loginToggle.addEventListener("click", () => {
        const isHidden = loginPanel.hasAttribute("hidden")
        if (isHidden) {
          loginPanel.removeAttribute("hidden")
        } else {
          loginPanel.setAttribute("hidden", "hidden")
        }
      })

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault()
        await validatePassword()
      })

      refreshBtn.addEventListener("click", loadImages)
      function resolveImageUrl(img) {
        if (img.id) return `${API_BASE}/img/${img.id}`
        if (img.imageUrl) return img.imageUrl
        return ""
      }

      async function fetchCatalog() {
        const sources = [
          { type: "local", url: DEFAULT_DB_URL },
          { type: "api", url: `${API_BASE}/api/images` },
        ]

        for (const source of sources) {
          try {
            const res = await fetch(source.url, { cache: "no-store" })
            if (!res.ok) throw new Error("Falha ao carregar catálogo")
            const data = await res.json()

            return normalizeCatalogData(data)
          } catch (error) {
            console.warn(`Falha ao carregar via ${source.type}:`, error)
          }
        }

        throw new Error("Nenhuma fonte de catálogo respondeu.")
      }

      function normalizeCatalogData(data) {
        if (Array.isArray(data?.items)) {
          return { images: data.items }
        }
        if (Array.isArray(data?.images)) {
          return { images: data.images }
        }
        return { images: [] }
      }

      function updateModalNavigation() {
        const hasMultiple = currentImages.length > 1
        modalPrev.disabled = !hasMultiple
        modalNext.disabled = !hasMultiple
        modalPrev.setAttribute("aria-disabled", String(!hasMultiple))
        modalNext.setAttribute("aria-disabled", String(!hasMultiple))
      }

      function updateModalImage() {
        const img = currentImages[currentIndex]
        if (!img) return
        modalImage.src = resolveImageUrl(img)
        modalImage.alt = img.name || img.originalName || "Imagem do catálogo"
      }

      function openModal(index) {
        if (!currentImages.length) return
        currentIndex = index
        updateModalNavigation()
        updateModalImage()
        imageModal.removeAttribute("hidden")
        document.body.classList.add("modal-open")
      }

      function closeModal() {
        imageModal.setAttribute("hidden", "hidden")
        document.body.classList.remove("modal-open")
        currentIndex = -1
      }

      function stepModal(direction) {
        if (!currentImages.length) return
        const total = currentImages.length
        currentIndex = (currentIndex + direction + total) % total
        updateModalImage()
      }

      modalClose.addEventListener("click", closeModal)
      imageModal
        .querySelector(".modal-backdrop")
        .addEventListener("click", closeModal)
      modalPrev.addEventListener("click", () => stepModal(-1))
      modalNext.addEventListener("click", () => stepModal(1))

      document.addEventListener("keydown", (event) => {
        if (imageModal.hasAttribute("hidden")) return
        if (event.key === "Escape") {
          closeModal()
        } else if (event.key === "ArrowRight") {
          stepModal(1)
        } else if (event.key === "ArrowLeft") {
          stepModal(-1)
        }
      })

      loadImages()
    </script>
  </body>
</html>
